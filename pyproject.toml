[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tahoe-house-operator"
version = "0.1.0"
description = "Human-guided STR property operator MVP"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.6,<2",
  "fastapi>=0.115,<1",
  "langgraph>=0.3,<2",
  "mcp>=1.9,<2",
  "openai>=1.70,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tahoe_operator"]

[tool.hatch.build.targets.wheel.force-include]
"src/tahoe_operator/static" = "tahoe_operator/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
