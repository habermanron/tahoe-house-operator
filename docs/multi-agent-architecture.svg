<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Tahoe House Operator multi-agent coordination</title>
  <desc id="desc">A LangGraph supervisor routes work to parallel, tool-scoped specialists. Their evidence flows to a code-based critic and reporter. One House MCP server is the only tool boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#536b7c"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#315f82"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#237653"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#20384e}
      .title{font-size:27px;font-weight:750}.sub{font-size:14px;fill:#5d7180}
      .panel{fill:#f7f9fb;stroke:#aebdc8;stroke-width:1.5;rx:15}
      .card{fill:#fff;stroke:#bac8d2;stroke-width:1.4;rx:11}
      .blue{fill:#edf4fa;stroke:#789bb6}.green{fill:#edf7f0;stroke:#78ae8e}
      .gold{fill:#fff6e7;stroke:#d4b574}.purple{fill:#f3effa;stroke:#a394c2}
      .dark{fill:#1d3c5a;stroke:#1d3c5a}.h{font-size:17px;font-weight:700}.ch{font-size:15px;font-weight:700}
      .body{font-size:13px;fill:#475d6d}.small{font-size:11px;fill:#617684}.white{fill:#fff}
      .line{fill:none;stroke:#536b7c;stroke-width:2;marker-end:url(#arrow)}
      .blueLine{fill:none;stroke:#315f82;stroke-width:2.3;marker-end:url(#arrowBlue)}
      .greenLine{fill:none;stroke:#237653;stroke-width:2.3;marker-end:url(#arrowGreen)}
      .dash{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1400" height="790" fill="#fff"/>
  <text x="38" y="48" class="title">Tahoe House Operator · bounded specialist coordination</text>
  <text x="39" y="74" class="sub">One LangGraph supervisor · parallel domain specialists · one House MCP tool boundary · code-based critic</text>

  <!-- Coordination and evidence flows -->
  <path d="M700 190 V224 H215 V260" class="blueLine"/>
  <path d="M700 190 V260" class="blueLine"/>
  <path d="M700 190 V224 H1180 V260" class="blueLine"/>
  <path d="M215 415 V451 H700 V481" class="line"/>
  <path d="M700 415 V481" class="line"/>
  <path d="M1180 415 V451 H700 V481" class="line"/>
  <path d="M700 570 V600" class="greenLine"/>
  <path d="M700 677 H1010" class="greenLine"/>

  <rect x="460" y="105" width="480" height="85" class="card blue"/>
  <text x="485" y="136" class="h">Supervisor · LangGraph</text>
  <text x="485" y="160" class="body">Parses request → builds typed task plan → routes only relevant work</text>
  <text x="485" y="179" class="small">Gateway model interprets language; no arbitrary tool names or writes</text>

  <rect x="55" y="260" width="320" height="155" class="card green"/>
  <text x="77" y="292" class="ch">Compliance specialist</text>
  <text x="77" y="318" class="body">Occupancy · stay · trash · parking</text>
  <text x="77" y="344" class="small">get_permit · occupancy_limit</text>
  <text x="77" y="362" class="small">check_stay · check_trash · check_parking</text>
  <text x="77" y="392" class="small">Deterministic rules and results</text>

  <rect x="540" y="260" width="320" height="155" class="card blue"/>
  <text x="562" y="292" class="ch">Calendar specialist</text>
  <text x="562" y="318" class="body">Availability · open nights · conflicts</text>
  <text x="562" y="344" class="small">get_timeline · find_gaps</text>
  <text x="562" y="370" class="small">Read-only in analysis; no calendar mutation</text>
  <text x="562" y="396" class="small">Returns event evidence and conflict list</text>

  <rect x="1025" y="260" width="320" height="155" class="card purple"/>
  <text x="1047" y="292" class="ch">Knowledge specialist</text>
  <text x="1047" y="318" class="body">Retrieves relevant property sources</text>
  <text x="1047" y="344" class="small">search_corpus only · passages + citations</text>
  <text x="1047" y="370" class="small">Treats retrieved text as evidence,</text>
  <text x="1047" y="388" class="small">not as executable instructions</text>

  <rect x="300" y="481" width="800" height="89" class="card dark"/>
  <text x="326" y="514" class="ch white">One House MCP server · specialist-specific tool allow-lists</text>
  <text x="326" y="539" class="small white">All tool calls are traced with specialist, arguments, and structured result; no raw credentials in agents</text>
  <text x="326" y="558" class="small white">Calendar events · synthetic permit/rules · local corpus/vector index · read-only adapters later</text>

  <rect x="460" y="600" width="480" height="77" class="card gold"/>
  <text x="485" y="632" class="ch">Critic · deterministic, no tools</text>
  <text x="485" y="655" class="body">Checks evidence and cross-domain constraints; fail → review / explicit operator revision</text>

  <rect x="1010" y="614" width="300" height="63" class="card blue"/>
  <text x="1033" y="641" class="ch">Reporter → owner</text>
  <text x="1033" y="662" class="small">Cited answer · approval-gated proposals</text>

  <rect x="54" y="617" width="340" height="111" class="card"/>
  <text x="76" y="648" class="ch">Future specialists (not MVP)</text>
  <text x="76" y="674" class="body">Turnover · Guest Desk · Finance · Pricing</text>
  <text x="76" y="700" class="small">Add only with clear responsibilities and narrow tools</text>

  <path d="M56 756 H96" class="blueLine"/>
  <text x="108" y="760" class="small">typed task / tool request</text>
  <path d="M323 756 H363" class="line"/>
  <text x="375" y="760" class="small">structured result / evidence</text>
  <path d="M622 756 H662" class="greenLine"/>
  <text x="674" y="760" class="small">critic pass / fail and human approval</text>
  <text x="1040" y="760" class="small">No peer-to-peer negotiation</text>
</svg>
